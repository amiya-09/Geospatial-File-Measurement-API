[project]
name = "geo-measure-api"
version = "0.1.0"
description = "Geospatial File Measurement API"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "sqlalchemy",
    "shapely>=2",
    "pyproj",
    "pyshp",
    "defusedxml",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# pyshp warnings are errors unless a test marks them as expected (corrupt-fixture tests).
filterwarnings = [
    "error::shapefile.PossiblyCorruptFileHeader",
    "error::shapefile.PossibleDataLoss",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
